[tool.poetry]
name = "ohcoach-cell-tools"
version = "0.1.0"
description = ""
authors = ["Jaebok Shin <jaebok.shin@fitogether.com>"]

[tool.poetry.dependencies]
python = ">=3.9,<3.11"
pandas = "1.4.4"
boto3 = "^1.20.37"
requests = "^2.27.1"
python-dotenv = "^0.19.2"
requests-aws4auth = "^1.1.1"
pyproj = "^3.3.0"
timezonefinder = "^6.1.9"
xlsxwriter = "^3.0.3"
openpyxl = "^3.0.10"
botocore = "^1.29.129"

[tool.poetry.dev-dependencies]
pytest = "^6.2"
moto = "^2.3.2"
pyright = "^0.0.13"
black = "^22.3.0"
isort = "^5.10.1"
flake8 = "^4.0.1"
pre-commit = "^2.17.0"
plotly = "^5.10.0"
dash = "^2.6.2"
plotly-resampler = "^0.8.1"
pytest-cov = "^4.0.0"
dash-bootstrap-components = "^1.2.1"
SQLAlchemy = "^1.4.42"

[tool.poetry.scripts]
convert = "scripts.datetime_converter.converter:start"
parse = "scripts.parse:start"
sanitize = "scripts.sanitize:start"
verification = "scripts.verification:start"

[tool.isort]
line_length=100
multi_line_output=3
include_trailing_comma=true
use_parentheses=true
ensure_newline_before_comments=true
lines_between_sections=true
skip=[".venv", "venv", "deploy", ".git", ".github"]
extend_skip=[".md", ".json"]

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
(
      \.git
    | \.gitignore
    | \.github
    | \.venv
    | \venv
    | \.pytest_cache
    | \.deploy
)
'''

[tool.pyright]
pythonVersion="3.9"
include = ["ohcoach_cell_tools", "tests", "scripts"]
exclude = [
  "**/__pycache__",
  "**/.venv/",
  "**/venv/",
  "**/deploy/",
  "**/.git/",
  "**/.github/",
]
ignore = []
stubPath = ""
reportMissingImports = false
reportMissingTypeStubs = false

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]

[tool.coverage.run]
branch = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
