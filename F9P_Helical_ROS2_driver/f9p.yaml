ublox_gps_node:
  ros__parameters:
    debug: 0
    device: "/dev/f9p_helical"
    frame_id: "gps"

    # Serial
    uart1:
      baudrate: 115200

    # Navigation rates
    # For F9P HPG firmware, nav_rate must be 1 Hz, "rate" is the measurement rate multiplier.
    rate: 1.0       # Hz navPVT update rate
    nav_rate: 1

    # TMODE3: operating mode
    # 0 = disabled (rover), 1 = survey-in, 2 = fixed base
    tmode3: 0

    # Optional: GNSS constellation enable (defaults are usually fine)
    gnss:
      gps: true
      glonass: true
      galileo: true
      beidou: true

    # Optional: publish config – make sure NAV-PVT etc. are published.
    publish:
      all: true

